name: Fire schedule items

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/schedule/fire
        run: |
          curl -sf -X GET "https://claude-pa-nine.vercel.app/api/schedule/fire" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
